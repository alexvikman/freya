name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the commit it releases.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless. github.workflow is the calling
# workflow when the release runs these checks, so a release and a push to the same branch never
# cancel each other. (Group names ignore case: "ci-Release-…" is not the release's own group.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        # The version in rust-toolchain.toml, with clippy and rustfmt.
        run: rustup toolchain install
      - name: Install ALSA, fontconfig and xkbcommon headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev
      # --locked: what is built and tested is what Cargo.lock says, which is what was vetted;
      # a stale lock fails instead of being updated quietly.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all --no-fail-fast

  # Known vulnerabilities, licenses and sources (cargo-deny), and that every crate is audited or
  # knowingly exempted (cargo-vet); see docs/DEPENDENCIES.md.
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-vet --locked --version 0.10.2
      - run: cargo deny --locked check
      - run: cargo vet --locked

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck ci/*.sh .githooks/pre-commit

  # Every commit, scanned for credentials, as the pre-commit hook in .githooks scans each new one.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo sh ci/install-gitleaks.sh
      - run: gitleaks git --redact --no-banner .

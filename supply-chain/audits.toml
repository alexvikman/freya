[[audits.zip]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "9.0.1 -> 9.0.4"
notes = '''Security fixes: enclosed_name and simplified_components now reject a separator inside one component (a verbatim \\?\ path such as \\?\C:\../b could pass enclosed_name in 9.0.1 and, joined onto a normal path on Windows, write one level above the target); symlink extraction no longer lets '..' after a missing component escape the target. Also checked_add for header offsets, a cached parse of central-directory chains (bounded work on crafted archives), read-only handling on non-Unix, lazy zstd init, and the legacy decoders (feature-gated) rewritten as streams. No new unsafe or network access; file writes only in the existing extract path.'''


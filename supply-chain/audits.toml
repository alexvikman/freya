
# cargo-vet audits file

[[audits.anyhow]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "1.0.103 -> 1.0.104"
notes = "Only version numbers and a dev-dependency (syn 3) changed."

[[audits.ctrlc]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "3.5.2"
notes = "Installs a SIGINT (and with the termination feature SIGTERM/SIGHUP) handler that only posts a semaphore (sem_post, dispatch semaphore on Apple, a Win32 semaphore on Windows); a named thread waits on it and calls the user's handler. The static semaphore is written once under a mutex-guarded init. No I/O or network."

[[audits.directories]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "6.0.0"
notes = "Builds platform directory paths from the home directory, XDG variables (absolute paths only) and dirs-sys known folders. No unsafe, no I/O beyond what dirs-sys does, no network."

[[audits.log]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "0.4.33 -> 0.4.34"
notes = "Adds an alloc feature that gates set_boxed_logger and the Box<T> impl instead of std; no new unsafe, I/O or network."

[[audits.objc2]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "0.6.3 -> 0.6.5"
notes = "Refactors define_class! (static class names via export_name, reuse of an existing auto-named class across dylibs) and fixes a miscompilation in retain_autoreleased by keeping it from being tail-called; the asm! blocks only gain an input register. No new I/O or network."

[[audits.objc2-media-player]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "0.3.2"
notes = "Bindings to Apple's MediaPlayer framework generated by objc2's header-translator: extern_class!/extern_methods! declarations, extern statics, enum newtypes with Encode impls and protocol conformances, plus one #[link] to MediaPlayer.framework. No build script, no hand-written unsafe beyond a single wrapper around an extern bool function, no Send/Sync impls, no I/O or network."

[[audits.objc2-security]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "0.3.2"
notes = "Bindings to Apple's Security framework generated by objc2's header-translator: extern functions, extern statics, CF type declarations and enum newtypes, plus one #[link] to Security.framework. Hand-written parts are type aliases, an SSLCipherSuite alias, CSSM structs and one extern declaration (AuthorizationExecuteWithPrivileges), none with a body. The only Send/Sync impls are for SecCertificate, which Apple documents as immutable and thread-safe. No build script, no I/O or network. Freya uses SecItemAdd, SecItemCopyMatching and SecItemDelete to keep the Last.fm session key in the login keychain."

[[audits.realfft]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "3.5.0"
notes = "Real-to-complex FFTs on top of rustfft. The two unsafe blocks view a checked-length &mut [T] as &mut [Complex<T>] of half the length; Complex is repr(C), so this is sound. No I/O or network."

[[audits.serde]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "1.0.228 -> 1.0.229"
notes = "Version bumps, lint names, MSRV check in build.rs, and a reborrow in seq_impl's visit_seq; no new unsafe, I/O or network."

[[audits.spin_on]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "0.1.1"
notes = "116 lines: a busy-polling block_on with a no-op waker. The only unsafe builds a Waker from a static no-op vtable, which is sound. No I/O or network."

[[audits.winresource]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
version = "0.1.34"
notes = "A build-script helper, no unsafe. Writes a resource script to OUT_DIR, runs the resource compiler (windres and ar for gnu, rc.exe or llvm-rc for msvc; paths from RC_PATH, WINDRES, AR, CROSS_COMPILE or the Windows SDK found with `reg query`) and prints cargo link directives. Reads Cargo.toml only with its default toml feature, which Freya leaves off. No network."

[[audits.zip]]
who = "Freya maintainers (AI-assisted review by Claude)"
criteria = "safe-to-deploy"
delta = "9.0.1 -> 9.0.4"
notes = '''Security fixes: enclosed_name and simplified_components now reject a separator inside one component (a verbatim \\?\ path such as \\?\C:\../b could pass enclosed_name in 9.0.1 and, joined onto a normal path on Windows, write one level above the target); symlink extraction no longer lets '..' after a missing component escape the target. Also checked_add for header offsets, a cached parse of central-directory chains (bounded work on crafted archives), read-only handling on non-Unix, lazy zstd init, and the legacy decoders (feature-gated) rewritten as streams. No new unsafe or network access; file writes only in the existing extract path.'''


delta = "1.22.0 -> 1.25.2"
notes = "The raw diff is mostly CRLF to LF line endings; the real changes: an `impl core::error::Error` behind the new `impl_core_error` feature, a hidden derive helper module, AVX-512 impls moved from `nightly_stdsimd` to `avx512_simd`. New unsafe marker impls, all sound: `NoUninit` for arrays of char/bool/NonZero, `AnyBitPattern` for arrays of `MaybeUninit<T: AnyBitPattern>`, `ZeroableInOption` for fn pointers (null niche), `Pod`/`Zeroable` for `Simd<T, N>` behind a nightly feature. No build script, I/O, process, network, env or FFI changes."


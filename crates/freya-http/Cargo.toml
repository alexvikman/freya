[package]
name = "freya-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Freya's small HTTP/1.1 server, over TLS or not: Freya Server's, and the page proxy Freya logs
# in through.
[dependencies]
httparse = "1.10.1"
log = "0.4.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.152"

[features]
# The short waits of tests, for the tests of the programs that use it too.
quick = []

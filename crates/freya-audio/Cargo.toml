[package]
name = "freya-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
freya-decode = { path = "../freya-decode", default-features = false }
log = "0.4.34"
realfft = "3.5.0"
rtrb = "0.4.0"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
thiserror = "2.0.21"
ureq = "3"

[features]
default = ["opus"]
# Opus through libopus, built from source; needs cmake. Without it, Opus files fail to open.
opus = ["freya-decode/opus"]

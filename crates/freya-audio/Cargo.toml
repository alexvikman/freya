[package]
name = "freya-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
log = "0.4.34"
realfft = "3.5.0"
rtrb = "0.4.0"
rubato = "5.0.1"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
symphonia-adapter-libopus = { version = "0.3.0", optional = true }
thiserror = "2.0.21"
ureq = "3"

[features]
default = ["opus"]
# Opus through libopus, built from source; needs cmake. Without it, Opus files fail to open.
opus = ["dep:symphonia-adapter-libopus"]

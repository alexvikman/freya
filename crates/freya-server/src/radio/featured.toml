# The stations Freya picked: long-running stations, most of them listener-supported, whose
# streams were tried. They come first in the radio directory, and on its first page, whether
# the server asks Radio Browser for its stations or not.
#
# A station's tags are those Freya knows (see tags.rs), its country and languages apart.
# "quality:lossless" is for a FLAC stream at CD quality, "quality:hi-res" for one of more.


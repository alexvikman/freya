# The stations Freya picked: long-running stations, most of them public or listener-supported,
# whose streams were tried: each was reached, and decoded by Freya, when it was added. They come
# first in the radio directory, and on its first page, whether the server asks Radio Browser
# for its stations or not.
#
# A station's tags are those Freya knows (see tags.rs), its country and languages apart.
# "quality:lossless" is for a FLAC stream, "quality:hi-res" for one of more than 16 bits or
# 48 kHz besides, as its stream said when it was tried; "quality:high" is added to a lossy one
# of 256 kbps or more. A row of the first page shows the stations it names, or the best known
# of its tags together.


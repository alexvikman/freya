[package]
name = "freya-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Freya Server's own packages: the library Freya plays from, on this computer or another, with
# or without a screen (see docs/PACKAGING.md).
[package.metadata.packager]
product-name = "Freya Server"
authors = ["Freya contributors"]
# Its LaunchAgent's label too (see src/autostart.rs).
identifier = "io.github.alexvikman.freya.server"
category = "Music"
description = "The music library Freya plays from"
long-description = "Freya Server keeps a music library, its pictures, playlists and plays, for Freya on this computer and on others on the network. It starts when you log in, and runs without a screen too."
copyright = "Freya contributors. MIT OR Apache-2.0."
# Both programs in one build, for either package: their shared crates are built once, with
# the same features, and the other package finds its program built already.
before-packaging-command = "cargo build --locked --release -p freya -p freya-server"
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "freya-server", main = true }]
# The licenses of what is built into it, which go with it (see docs/DEPENDENCIES.md).
resources = ["../../licenses/THIRD-PARTY.html"]
icons = [
    "../../assets/icons/32x32.png",
    "../../assets/icons/64x64.png",
    "../../assets/icons/128x128.png",
    "../../assets/icons/256x256.png",
    "../../assets/icons/icon.png",
    "../../assets/icons/icon.ico",
]

# Windows: the server asked to stop before its files are replaced (see wix/stop-server.wxs).
[package.metadata.packager.wix]
fragment-paths = ["wix/stop-server.wxs"]
custom-action-refs = ["StopFreyaServer"]

# An icon in the menu bar, not in the Dock (see src/menu/mac.rs).
[package.metadata.packager.macos]
minimum-system-version = "11.0"
background-app = true

[dependencies]
base64 = "0.23.1"
# Stopped by Ctrl-C, SIGTERM and SIGHUP alike.
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
env_logger = "0.11.11"
# Large answers gzipped (see src/serve.rs), with the zlib in Rust Freya already uses.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
freya-http = { path = "../freya-http" }
freya-lastfm = { path = "../freya-lastfm" }
freya-library = { path = "../freya-library" }
freya-media = { path = "../freya-media" }
freya-protocol = { path = "../freya-protocol" }
freya-update = { path = "../freya-update" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
# Watching the music folders for changes (see src/folder_watch.rs).
notify = "8.2.0"
# Tokens, pairing keys and passwords (see src/accounts.rs).
ring = "0.17.14"
# TLS for clients on other computers (see src/tls.rs), with the ring provider ureq already uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
# Radio Browser's stations (see src/radio/browser.rs), as Freya's other crates ask the web.
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Last.fm's session in the Credential Manager (see src/scrobbler/session.rs), starting the
# server at login, in the Run key (see src/autostart.rs), and its icon in the notification area
# (see src/menu/windows.rs), and stopping it for the installer (see src/stop.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The short waits of tests, as the HTTP server's own tests have them.
freya-http = { path = "../freya-http", features = ["quick"] }

[build-dependencies]
# Freya's icon and the server's name in freya-server.exe (see build.rs), as Freya builds its
# own with.
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The server's icon in the menu bar (see src/menu/mac.rs), with the AppKit bindings Freya
# already uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURL"] }

[target.'cfg(unix)'.dependencies]
# How many files the server may hold open (see src/main.rs).
libc = "0.2.190"

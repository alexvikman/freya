[package]
name = "freya-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
# Stopped by Ctrl-C, SIGTERM and SIGHUP alike.
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
env_logger = "0.11.11"
freya-lastfm = { path = "../freya-lastfm" }
freya-library = { path = "../freya-library" }
freya-protocol = { path = "../freya-protocol" }
httparse = "1.10.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
# Watching the music folders for changes (see src/folder_watch.rs).
notify = "8.2.0"
# Tokens, pairing keys and passwords (see src/accounts.rs).
ring = "0.17.14"
# TLS for clients on other computers (see src/tls.rs), with the ring provider ureq already uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
# Last.fm's session in the Credential Manager (see src/scrobbler/session.rs).
# And starting the server at login, in the Run key (see src/autostart.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The server's icon in the menu bar (see src/menu_bar.rs), with the AppKit bindings Freya
# already uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }

[target.'cfg(unix)'.dependencies]
# How many files the server may hold open (see src/main.rs).
libc = "0.2.190"

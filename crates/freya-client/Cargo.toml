[package]
name = "freya-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
freya-protocol = { path = "../freya-protocol" }
log = "0.4.34"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ureq = "3"

[dev-dependencies]
freya-audio = { path = "../freya-audio" }
freya-library = { path = "../freya-library" }
freya-server = { path = "../freya-server" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# The system's keychain for the servers' tokens (see src/session.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

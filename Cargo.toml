[workspace]
resolver = "3"
members = ["freya", "crates/*"]
# Patched copies of other crates (see vendor/README.md), not part of Freya's own code.
exclude = ["vendor"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Never published; an unrelated crate named `freya` exists on crates.io.
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Decoding in an unoptimised build is too slow for real-time playback.
opt-level = 2

# Whole-program optimization: smaller, somewhat faster binaries, at the cost of slower
# release builds.
[profile.release]
lto = "fat"
codegen-units = 1

# Slint's software renderer on macOS presents through softbuffer; Freya's copy keeps the pixels
# between frames and shows them through IOSurfaces (see vendor/README.md).
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }

[workspace]
resolver = "3"
members = ["freya", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Never published; an unrelated crate named `freya` exists on crates.io.
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Decoding in an unoptimised build is too slow for real-time playback.
opt-level = 2

# Whole-program optimization: smaller, somewhat faster binaries, at the cost of slower
# release builds.
[profile.release]
lto = "fat"
codegen-units = 1

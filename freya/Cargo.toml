[package]
name = "freya"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p freya` runs Freya, not its terminal launcher.
default-run = "freya"

description = "A skinnable music player"

[lints]
workspace = true

# Installers, made with cargo-packager (see docs/PACKAGING.md).
[package.metadata.packager]
product-name = "Freya"
# Shown as the package maintainer, e.g. in the .deb.
authors = ["Freya contributors"]
# From the GitHub repository Freya is released from, alexvikman/freya. Freya's own files are
# found by its name, not by this.
identifier = "io.github.alexvikman.freya"
category = "Music"
description = "A skinnable music player"
long-description = "Freya plays the library of a Freya Server, on this computer or another: MP3, FLAC, APE, Ogg, Opus, AAC, ALAC, WAV and internet radio, with a playlist, a 10-band equalizer and skins."
copyright = "Freya contributors. MIT OR Apache-2.0. The interface uses Slint under its royalty-free license."
# Both programs in one build, for either package: their shared crates are built once, with
# the same features, and the other package finds its program built already.
before-packaging-command = "cargo build --locked --release -p freya -p freya-server"
out-dir = "../target/packages"
binaries-dir = "../target/release"
# Freya Server is a package of its own (see crates/freya-server/Cargo.toml).
binaries = [{ path = "freya", main = true }]
# The licenses of what is built into them, which go with them (see docs/DEPENDENCIES.md).
resources = ["../licenses/THIRD-PARTY.html"]
icons = [
    "../assets/icons/32x32.png",
    "../assets/icons/64x64.png",
    "../assets/icons/128x128.png",
    "../assets/icons/256x256.png",
    "../assets/icons/icon.png",
    "../assets/icons/icon.ico",
]

# Windows: freya-cli.exe, for terminals, and Freya's folder on the PATH (see wix/freya-cli.wxs).
[package.metadata.packager.wix]
fragment-paths = ["wix/freya-cli.wxs"]
component-refs = ["FreyaCli"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.deb]
# Linked: audio and fonts. Loaded while running: keyboard layouts, OpenGL, and the X11 and
# Wayland libraries winit opens for the window.
depends = [
    "libasound2",
    "libfontconfig1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libegl1",
    "libgl1",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxi6",
    "libxrandr2",
    "libwayland-client0",
    "libwayland-cursor0",
    "libwayland-egl1",
]

[package.metadata.packager.appimage]
# For audio output.
libs = ["libasound.so.2"]

# Freya for a terminal on Windows, where Freya itself is a window app (see src/cli_launcher.rs).
[[bin]]
name = "freya-cli"
path = "src/cli_launcher.rs"

[dependencies]
freya-audio = { path = "../crates/freya-audio" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
env_logger = "0.11.11"
# Local time in the log (see src/log_capture.rs), as env_logger already brings it.
jiff = "0.2.38"
freya-skin = { path = "../crates/freya-skin" }
# Tags, CUE sheets, playlist files, covers and pictures; the library itself is the server's.
freya-media = { path = "../crates/freya-media" }
freya-client = { path = "../crates/freya-client" }
# The login proxy's HTTP server (see src/gui/page_proxy.rs), as Freya Server's.
freya-http = { path = "../crates/freya-http" }
freya-protocol = { path = "../crates/freya-protocol" }
freya-update = { path = "../crates/freya-update" }
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
slint-interpreter = "1.18.1"
rfd = "0.17.2"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
# With `termination`, SIGTERM and SIGHUP too (logging out, shutting down, a closed terminal).
ctrlc = { version = "3.5.2", features = ["termination"] }
# The browser's login through Freya's page proxy (see src/gui/page_proxy.rs), and streams,
# with the HTTP and TLS stack the client already uses.
ring = "0.17.14"
ureq = "3"
# Freya's icon on its windows (see gui/app_icon.rs) and the hologram's poses (see
# gui/hologram), with the decoders the library and skin loader already use.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
# The native window behind Slint's: for Windows' media controls and the spectrum layer.
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# MPRIS, the system media controls (see gui/system_media/mpris.rs): the zbus that Slint's
# accessibility and tray support already bring, plus its blocking API, which adds no crates.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# The spectrum drawn on a Wayland subsurface or an X11 child window (see gui/native_spectrum).
memmap2 = "0.9.11"
rustix = { version = "1.1.5", features = ["fs"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
x11rb = { version = "0.13.2", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The spectrum drawn with Core Animation (see gui/native_spectrum.rs), media keys and Now
# Playing through the MediaPlayer framework (see gui/system_media/now_playing.rs), and skins
# drawn into the title bar (see gui/title_bar/mac.rs).
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGPath"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSKeyValueObserving", "NSObject", "NSProcessInfo", "NSString", "NSUserDefaults", "NSValue"] }
objc2-media-player = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CAShapeLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
# The hologram's drawing thread measures its own CPU time (see gui/hologram/metal.rs).
libc = "0.2.190"
# The hologram, drawn by the graphics card (see gui/hologram/metal.rs). Already in the tree through
# Slint's renderers.
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBlitCommandEncoder", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
# Printing to the terminal Freya was started from, and a frameless window's edges (see
# gui/title_bar/windows.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The spectrum drawn with Windows.UI.Composition (see gui/native_spectrum.rs), and media keys
# and the media overlay (see gui/system_media/smtc.rs).
windows = { version = "0.62.2", features = [
    "Foundation_Numerics",
    "Media",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
] }
windows-numerics = "0.3.1"

# The tests run a library and its server in this process (see src/gui/library.rs), with the
# HTTP server's short waits.
[dev-dependencies]
freya-http = { path = "../crates/freya-http", features = ["quick"] }
freya-library = { path = "../crates/freya-library" }
freya-server = { path = "../crates/freya-server" }

[build-dependencies]
slint-build = "1.18.1"
# Freya's icon and version in freya.exe (see build.rs). Without its default features it reads no
# Cargo.toml, and brings only version_check, which Freya already has.
winresource = { version = "0.1.34", default-features = false }
